name: DevTinder Backend CI/CD

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Get Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: npm install

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            cd ~/devTinder

            git pull origin master

            docker build --no-cache -t devtinder-backend .

            docker rm -f devtinder-backend || true

            docker run -d \
              --name devtinder-backend \
              --network devtinder-network \
              --env-file .env \
              --restart unless-stopped \
              -p 3000:3000 \
              devtinder-backend
